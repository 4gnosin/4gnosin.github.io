<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="auto" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 10px; }
      .step-box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .step-box-final { fill: #1e293b; stroke: #eab308; stroke-width: 1.8; rx: 8px; }
      .header { fill: #f8fafc; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
      .step-num { fill: #fde047; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      .step-title { fill: #f8fafc; font-size: 12.5px; font-weight: 600; }
      .step-desc { fill: #94a3b8; font-size: 10.5px; }
      .step-math { fill: #38bdf8; font-size: 11px; font-family: Cambria Math, Consolas, monospace; }
      .arrow { stroke: #fde047; stroke-width: 1.8; fill: none; marker-end: url(#arrow-gold); }
    </style>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fde047" />
    </marker>
  </defs>

  <rect width="960" height="220" class="bg" />
  <text x="480" y="28" text-anchor="middle" class="header">4-STEP PEDAGOGICAL BLACKBOARD RESOLUTION SPECIFICATION (GOLD STANDARD)</text>

  <!-- Step 1 -->
  <rect x="20" y="48" width="210" height="150" class="step-box" />
  <text x="34" y="70" class="step-num">Step 01</text>
  <text x="34" y="90" class="step-title">Data &amp; SI Conversion</text>
  <text x="34" y="112" class="step-desc">Extract given parameters and</text>
  <text x="34" y="127" class="step-desc">convert non-SI units upfront.</text>
  <text x="34" y="155" class="step-math">P = 5 bar = 5 * 10^5 Pa</text>
  <text x="34" y="174" class="step-math">T = 27 C + 273 = 300 K</text>

  <!-- Step 2 -->
  <rect x="256" y="48" width="210" height="150" class="step-box" />
  <text x="270" y="70" class="step-num">Step 02</text>
  <text x="270" y="90" class="step-title">Formula &amp; Isolation</text>
  <text x="270" y="112" class="step-desc">State governing physical law</text>
  <text x="270" y="127" class="step-desc">and solve algebraically first.</text>
  <text x="270" y="155" class="step-math">P * V = m * R * T</text>
  <text x="270" y="174" class="step-math">=&gt; V = (m * R * T) / P</text>

  <!-- Step 3 -->
  <rect x="492" y="48" width="210" height="150" class="step-box" />
  <text x="506" y="70" class="step-num">Step 03</text>
  <text x="506" y="90" class="step-title">Aligned Substitution</text>
  <text x="506" y="112" class="step-desc">Substitute values and align</text>
  <text x="506" y="127" class="step-desc">intermediate reductions.</text>
  <text x="506" y="155" class="step-math">\begin{aligned}</text>
  <text x="506" y="174" class="step-math">V &amp;= ... \\ &amp;= ... \end{aligned}</text>

  <!-- Step 4 -->
  <rect x="728" y="48" width="212" height="150" class="step-box-final" />
  <text x="742" y="70" class="step-num">Step 04 (Highlight)</text>
  <text x="742" y="90" class="step-title">Final Value &amp; SI Unit</text>
  <text x="742" y="112" class="step-desc">Compute final numerical value</text>
  <text x="742" y="127" class="step-desc">with mandatory physical unit.</text>
  <text x="742" y="155" class="step-math">V = 0,172 m^3</text>
  <text x="742" y="174" class="step-math">highlight: true</text>

  <!-- Arrows -->
  <path d="M 230 123 L 254 123" class="arrow" />
  <path d="M 466 123 L 490 123" class="arrow" />
  <path d="M 702 123 L 726 123" class="arrow" />
</svg>
