<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="auto" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 10px; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .node { fill: #0f172a; stroke: #475569; stroke-width: 1.2; rx: 5px; }
      .node-accent { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 5px; }
      .title { fill: #f8fafc; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .subtitle { fill: #94a3b8; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
      .label { fill: #e2e8f0; font-size: 12px; font-weight: 600; }
      .sublabel { fill: #94a3b8; font-size: 10.5px; font-family: Consolas, monospace; }
      .arrow { stroke: #38bdf8; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
      .arrow-muted { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrowhead-muted); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect width="960" height="360" class="bg" />
  <text x="480" y="30" text-anchor="middle" class="title">4GNOSIN.GITHUB.IO — SYSTEM ARCHITECTURE &amp; DATA PIPELINE</text>

  <!-- Column 1: Data Acquisition -->
  <rect x="24" y="50" width="260" height="286" class="panel" />
  <text x="154" y="74" text-anchor="middle" class="subtitle">1. Data Acquisition Layer</text>

  <rect x="44" y="92" width="220" height="58" class="node" />
  <text x="154" y="114" text-anchor="middle" class="label">Exam Bank Scraper</text>
  <text x="154" y="134" text-anchor="middle" class="sublabel">scripts/trapeza7.py -> data/inbox/</text>

  <rect x="44" y="168" width="220" height="58" class="node" />
  <text x="154" y="190" text-anchor="middle" class="label">Textbooks Downloader</text>
  <text x="154" y="210" text-anchor="middle" class="sublabel">scripts/edubooks.py -> data/books/</text>

  <rect x="44" y="244" width="220" height="68" class="node" />
  <text x="154" y="268" text-anchor="middle" class="label">Curriculum &amp; Agent Memory</text>
  <text x="154" y="286" text-anchor="middle" class="sublabel">data/syllabus/*.json</text>
  <text x="154" y="301" text-anchor="middle" class="sublabel">data/agent_memory/*.json</text>

  <!-- Column 2: AI Processing & Validation -->
  <rect x="330" y="50" width="300" height="286" class="panel" />
  <text x="480" y="74" text-anchor="middle" class="subtitle">2. AI Agent &amp; Compilation Layer</text>

  <rect x="350" y="92" width="260" height="52" class="node-accent" />
  <text x="480" y="113" text-anchor="middle" class="label">Exercise &amp; Solution Generator</text>
  <text x="480" y="131" text-anchor="middle" class="sublabel">src/generators/exercise_generator.py</text>

  <rect x="350" y="156" width="260" height="52" class="node-accent" />
  <text x="480" y="177" text-anchor="middle" class="label">Theory Authoring Engine</text>
  <text x="480" y="195" text-anchor="middle" class="sublabel">src/generators/theory_generator.py</text>

  <rect x="350" y="220" width="260" height="52" class="node-accent" />
  <text x="480" y="241" text-anchor="middle" class="label">4-Step Blackboard Animator</text>
  <text x="480" y="259" text-anchor="middle" class="sublabel">src/tools/calc_animator.py</text>

  <rect x="350" y="282" width="260" height="42" class="node" />
  <text x="480" y="300" text-anchor="middle" class="label">Figure Cropper &amp; Site Validator</text>
  <text x="480" y="315" text-anchor="middle" class="sublabel">image_extractor.py | site_validator.py</text>

  <!-- Column 3: Static SPA Frontend -->
  <rect x="676" y="50" width="260" height="286" class="panel" />
  <text x="806" y="74" text-anchor="middle" class="subtitle">3. Static SPA Frontend (site/)</text>

  <rect x="696" y="92" width="220" height="54" class="node" />
  <text x="806" y="114" text-anchor="middle" class="label">Application Shell &amp; Router</text>
  <text x="806" y="132" text-anchor="middle" class="sublabel">site/index.html + site/js/app.js</text>

  <rect x="696" y="160" width="220" height="54" class="node" />
  <text x="806" y="182" text-anchor="middle" class="label">Theory &amp; Catalog Payloads</text>
  <text x="806" y="200" text-anchor="middle" class="sublabel">site/content/{b,c}/{slug}/*.js</text>

  <rect x="696" y="228" width="220" height="54" class="node" />
  <text x="806" y="250" text-anchor="middle" class="label">Interactive Exercises &amp; Steps</text>
  <text x="806" y="268" text-anchor="middle" class="sublabel">site/exercises/{b,c}/{slug}/*.js</text>

  <rect x="696" y="292" width="220" height="32" class="node" />
  <text x="806" y="312" text-anchor="middle" class="sublabel">site/images/.../*.webp (84% compressed)</text>

  <!-- Connectors -->
  <path d="M 264 121 L 348 118" class="arrow" />
  <path d="M 264 197 L 348 182" class="arrow" />
  <path d="M 264 278 L 348 246" class="arrow-muted" />

  <path d="M 610 118 L 694 252" class="arrow" />
  <path d="M 610 182 L 694 187" class="arrow" />
  <path d="M 610 246 L 694 260" class="arrow" />
  <path d="M 610 303 L 694 308" class="arrow" />
</svg>
